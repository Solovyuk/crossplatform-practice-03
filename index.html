<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electron File Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Electron File Explorer</h1>
      <p>Практическая работа № 3</p>
      <p>Соловьюк М. А. | ТРПО23-1 | Вариант 9</p>
    </header>

    <section class="panel">
      <h2>Просмотр каталога</h2>

      <button id="loadBtn">
        Показать содержимое каталога
      </button>

      <div class="filters">
        <label for="filterType">Фильтр:</label>
        <select id="filterType">
          <option value="all">Все элементы</option>
          <option value="files">Только файлы</option>
          <option value="folders">Только каталоги</option>
          <option value="extension">По расширению</option>
        </select>

        <input
          id="extensionInput"
          type="text"
          placeholder="Например: .js"
          aria-label="Расширение файла"
          disabled
        >
      </div>

      <p id="status">Нажмите кнопку для загрузки каталога.</p>
      <ul id="fileList"></ul>
    </section>

    <footer>
      Кросс-платформенная разработка — Electron
    </footer>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
